<!DOCTYPE html>
<html lang="en" data-theme="serika">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>prokopton - grid tracker</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="512x512" href="./stoic_512.png" />
  <meta name="theme-color" content="#323437" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root, [data-theme="serika"] {
      --bg: #151617; --bg-alt: #1e232c; --main: #e2b714;
      --sub: #989ca2; --text: #deddd3; --error: #ca4754;
      --glass: rgba(50, 52, 55, 0.85);
    }
    [data-theme="carbon"] {
      --bg: #111111; --bg-alt: #191919; --main: #e2b714;
      --sub: #949292; --text: #d1d0c5; --error: #ca4754;
      --glass: rgba(17, 17, 17, 0.85);
    }
    [data-theme="dracula"] {
      --bg: #282a36; --bg-alt: #21222c; --main: #bd93f9;
      --sub: #7585b5; --text: #f8f8f2; --error: #ff5555;
      --glass: rgba(40, 42, 54, 0.85);
    }
    [data-theme="nord"] {
      --bg:#272c36; --bg-alt: #3c4454 ; --main: #88c0d0;
      --sub: #96a9cb; --text: #eceff4; --error: #bf616a;
      --glass: rgba(46, 52, 64, 0.85);
    }
    [data-theme="matrix"] {
      --bg: #000000; --bg-alt: #0a0f0a; --main: #15ff00;
      --sub: #005500; --text: #d1ffcd; --error: #ff3333;
      --glass: rgba(0, 0, 0, 0.85);
    }
    [data-theme="yggdrasil"] {
      --bg: #061518; --bg-alt: #0e272c; --main: #00e5ff;
      --sub: #3d7a85; --text: #d2f7ff; --error: #ff4a6e;
      --glass: rgba(6, 21, 24, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 76px);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 680px; width: 100%; margin: 0 auto; flex: 1;
      display: flex; flex-direction: column; gap: 16px; padding-top: 12px;
    }

    header { display: flex; justify-content: space-between; align-items: flex-start; }
    .header-left { display: flex; flex-direction: column; gap: 3px; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; font-weight: 700; }
    .logo span { color: var(--main); }
    .stoic-quote { font-size: 0.72rem; color: var(--sub); font-style: italic; }

    .header-controls {
      display: flex; gap: 8px; align-items: center;
    }

    .mode-bar {
      display: flex; gap: 10px; background: var(--bg-alt);
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; color: var(--sub);
    }
    .mode-bar button {
      background: none; border: none; color: inherit; font-family: inherit; cursor: pointer;
    }
    .mode-bar button:hover { color: var(--main); }

    .settings-icon-btn {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .settings-icon-btn:hover {
      border-color: var(--main);
      color: var(--main);
    }

    /* Sticky Floating Filter Wrapper */
    .sticky-filters {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 10px;
      margin-top: -8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Category Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      color: var(--sub);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .filter-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .filter-btn.active {
      background: var(--main);
      color: var(--bg);
      border-color: var(--main);
      font-weight: 700;
    }

    /* Input Box */
    .input-row {
      display: flex; align-items: center; gap: 10px; background: var(--bg-alt);
      padding: 12px 16px; border-radius: 8px; border: 1px solid transparent;
    }
    .input-row:focus-within { border-color: var(--main); }
    .prompt-char { color: var(--main); font-weight: 700; }
    .input-row input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 0.9rem;
    }
    .input-row input::placeholder { color: var(--sub); }

    /* Habit Cards */
    .habits-grid { display: flex; flex-direction: column; gap: 16px; }

    .habit-card {
      background: var(--bg-alt);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .habit-card:hover { border-color: var(--sub); }

    .habit-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .habit-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .habit-header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .habit-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .category-tag {
      font-size: 0.68rem;
      background: var(--bg);
      color: var(--main);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--sub);
      text-transform: lowercase;
    }

    .habit-meta {
      font-size: 0.75rem;
      color: var(--sub);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* High Contrast Icon-Only Action Buttons */
    .habit-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--sub);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      border-color: var(--main);
      color: var(--main);
      background: var(--bg-alt);
    }

    .icon-btn.delete-btn {
      border-color: rgba(202, 71, 84, 0.4);
      color: var(--error);
    }

    .icon-btn.delete-btn:hover {
      background: var(--error);
      color: var(--bg);
      border-color: var(--error);
    }

    /* Full-Horizon Interactive Visualization Matrix */
    .habit-matrix-container {
      width: 100%;
      padding: 2px 0 4px;
    }

    .habit-matrix {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-template-columns: repeat(13, 1fr);
      grid-auto-flow: column;
      gap: 4px;
      width: 100%;
    }

    .matrix-cell {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      /* ADJUST CELL CORNER RADIUS HERE (e.g. 3px = subtle, 6px = softer, 0px = sharp) */
      border-radius: 5px;
      background: var(--bg);
      cursor: pointer;
      transition: transform 0.12s ease, outline 0.12s ease;
    }

    .matrix-cell:hover {
      transform: scale(1.12);
      outline: 1.5px solid var(--text);
      z-index: 2;
    }

    .matrix-cell:active {
      transform: scale(0.95);
    }

    /* ADJUST GOAL-MET DOT SIZE HERE (33.33% ≈ 1/3 of the full grid cell) */
    .matrix-cell[data-level="0"][data-dot="true"]::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 33.33%;
      height: 33.33%;
      border-radius: 50%;
      background: var(--habit-accent, var(--main));
      opacity: 0.8;
      transform: translate(-50%, -50%);
    }

    .matrix-cell[data-level="1"] { background: var(--habit-accent, var(--main)); opacity: 0.3; }
    .matrix-cell[data-level="2"] { background: var(--habit-accent, var(--main)); opacity: 0.65; }
    .matrix-cell[data-level="3"] { background: var(--habit-accent, var(--main)); opacity: 1; }

    /* Bottom Action Row inside Card */
    .habit-today-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--bg);
      padding-top: 10px;
      font-size: 0.8rem;
      color: var(--sub);
    }

    .today-status-text {
      color: var(--text);
    }

    .today-status-text span {
      color: var(--habit-accent, var(--main));
      font-weight: 700;
    }

    .open-input-btn {
      background: var(--bg);
      border: 1px solid var(--habit-accent, var(--main));
      color: var(--habit-accent, var(--main));
      padding: 6px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .open-input-btn:hover, .open-input-btn.done {
      background: var(--habit-accent, var(--main));
      color: var(--bg);
    }

    /* Chart View Styles */
    .chart-range-bar {
      display: flex;
      gap: 8px;
    }
    .range-btn {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      color: var(--sub);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .range-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .range-btn.active {
      background: var(--main);
      color: var(--bg);
      border-color: var(--main);
      font-weight: 700;
    }

    /* Per-Card Sub-Metric Selector Bar */
    .metric-selector-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .metric-select-btn {
      background: var(--bg);
      border: 1px solid var(--sub);
      color: var(--sub);
      padding: 5px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .metric-select-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .metric-select-btn.active {
      background: var(--habit-accent, var(--main));
      color: var(--bg);
      border-color: var(--habit-accent, var(--main));
      font-weight: 700;
    }

    .chart-wrapper {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }
    .time-chart {
      width: 100%;
      height: 140px;
      display: block;
    }

    /* Metrics Cards Grid below Chart */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric-card {
      background: var(--bg);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label {
      font-size: 0.68rem;
      color: var(--sub);
      text-transform: uppercase;
    }
    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--habit-accent, var(--main));
    }

    /* Fixed Floating Bottom Navigation Bar */
    .bottom-nav-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 10px 20px calc(env(safe-area-inset-bottom, 12px) + 6px);
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: center;
    }

    .bottom-nav {
      display: flex;
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .nav-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--sub);
      padding: 10px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav-tab:hover {
      color: var(--text);
    }
    .nav-tab.active {
      background: var(--main);
      color: var(--bg);
      font-weight: 700;
    }

    /* Color Swatch Picker Grid */
    .color-picker-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.selected {
      border-color: var(--text);
      transform: scale(1.1);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }

    /* Full Calendar View inside Input Modal */
    .calendar-box {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }
    .cal-nav-btn {
      background: var(--bg);
      border: 1px solid var(--sub);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .cal-nav-btn:hover {
      border-color: var(--main);
      color: var(--main);
    }
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.65rem;
      color: var(--sub);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day-cell {
      min-height: 42px;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      transition: all 0.12s;
    }
    .cal-day-cell.empty {
      background: transparent;
      cursor: default;
    }
    .cal-day-cell:not(.empty):hover {
      border-color: var(--main);
    }
    .cal-day-cell.has-data {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
    }
    .cal-day-cell.selected {
      background: var(--main);
      color: var(--bg);
      border-color: var(--main);
      font-weight: 700;
    }
    .cal-day-num {
      font-size: 0.72rem;
      line-height: 1.1;
    }
    .cal-day-val {
      font-size: 0.62rem;
      color: var(--main);
      line-height: 1.1;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cal-day-cell.selected .cal-day-val {
      color: var(--bg);
    }

    /* Repeat Controls inside Edit Modal */
    .repeat-options-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .repeat-opt-btn {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      color: var(--sub);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .repeat-opt-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .repeat-opt-btn.active {
      background: var(--main);
      color: var(--bg);
      border-color: var(--main);
      font-weight: 700;
    }
    .repeat-config-box {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .repeat-inline-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .repeat-inline-row input {
      width: 72px;
      background: var(--bg);
      border: 1px solid var(--sub);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }
    .days-picker-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .day-chip-btn {
      background: var(--bg);
      border: 1px solid var(--sub);
      color: var(--sub);
      padding: 6px 2px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      text-align: center;
    }
    .day-chip-btn.active {
      background: var(--main);
      color: var(--bg);
      border-color: var(--main);
      font-weight: 700;
    }

    /* Sub-Metric Editor inside Edit Modal */
    .submetric-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .submetric-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .submetric-row input {
      flex: 1;
      min-width: 0;
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      border-radius: 6px;
      padding: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }
    .submetric-row input.unit-input {
      max-width: 85px;
    }
    .submetric-row input:focus {
      border-color: var(--main);
    }
    .remove-sub-btn {
      background: var(--bg-alt);
      border: 1px solid rgba(202, 71, 84, 0.5);
      color: var(--error);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .add-sub-btn {
      align-self: flex-start;
      background: var(--bg-alt);
      border: 1px dashed var(--sub);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .add-sub-btn:hover {
      border-color: var(--main);
      color: var(--main);
    }

    /* Modals (Edit, Input & Settings) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: none; place-items: center; padding: 20px; z-index: 50;
    }
    .modal-backdrop.open { display: grid; }
    .modal-box {
      background: var(--bg); border: 1px solid var(--sub); border-radius: 10px;
      width: min(92vw, 440px); padding: 20px; display: flex; flex-direction: column; gap: 16px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-box h3 { font-size: 1rem; color: var(--main); }
    .modal-subtitle { font-size: 0.75rem; color: var(--sub); margin-top: -10px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--sub); }
    .form-group input {
      background: var(--bg-alt); border: 1px solid var(--sub); border-radius: 6px;
      padding: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none;
      color-scheme: dark;
    }
    .form-group input:focus { border-color: var(--main); }

    .submetric-divider {
      border-top: 1px solid var(--bg-alt);
      padding-top: 10px;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--main);
      font-weight: 700;
    }
    
    .settings-action-btn {
      background: var(--bg-alt);
      border: 1px solid var(--sub);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }
    .settings-action-btn:hover {
      border-color: var(--main);
      color: var(--main);
      background: var(--bg);
    }
    .settings-action-btn.danger {
      border-color: rgba(202, 71, 84, 0.4);
      color: var(--error);
    }
    .settings-action-btn.danger:hover {
      background: var(--error);
      color: var(--bg);
      border-color: var(--error);
    }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
    .modal-buttons button {
      background: var(--bg-alt); border: 1px solid var(--sub); color: var(--text);
      padding: 8px 14px; border-radius: 6px; font-family: inherit; cursor: pointer; font-size: 0.8rem;
    }
    .modal-buttons button.primary { background: var(--main); color: var(--bg); border-color: var(--main); font-weight: 700; }

    footer {
      text-align: center; font-size: 0.7rem; color: var(--sub); padding-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <div class="logo"><span>&gt;_</span> prokopton</div>
        <div class="stoic-quote" id="stoicQuote">"Waste no more time arguing what a good man should be. Be one." - Marcus Aurelius</div>

        <div class="mode-bar">

        </div>

      </div>
    </header>

    <!-- Sticky Floating Filter Bar (Switches between Categories and Chart Ranges) -->

      <div class="filter-bar" id="filterBar"></div>
      <div class="chart-range-bar" id="chartRangeBar" style="display: none;">
        <button class="range-btn active" data-range="14">last 14d</button>
        <button class="range-btn" data-range="30">last 30d</button>
        <button class="range-btn" data-range="60">last 60d</button>
        <button class="range-btn" data-range="all">all time</button>
      </div>

    <!-- Quick Add Input -->
    <form class="input-row" id="addForm">
      <span class="prompt-char">+</span>
      <input type="text" id="habitInput" placeholder="add habit (e.g. cycling, read, gym)..." autocomplete="off" />
    </form>

    <!-- Current View Section (Cards with Heatmaps) -->
    <section id="cardsSection" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="habits-grid" id="habitsGrid"></div>
    </section>

    <!-- Chart View Section -->
    <section id="chartSection" style="display: none; flex-direction: column; gap: 16px;">
      <div class="habits-grid" id="chartContainer"></div>
    </section>

    <footer>
      <span>prokopton • local storage PWA</span>
    </footer>
  </div>

  <!-- Fixed Floating Bottom Navigation Bar -->
  <div class="bottom-nav-wrapper">
    <nav class="bottom-nav">
      <button class="nav-tab active" id="currentViewBtn">grid</button>
      <button class="nav-tab" id="chartViewBtn">charts</button>
    </nav>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3>settings & data backup</h3>
      <div class="modal-subtitle">manage your local storage & backup</div>
      
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
        <button type="button" class="settings-action-btn" id="exportDataBtn">
          <span>💾 export backup (.json)</span>
          <span style="font-size: 0.7rem; color: var(--sub);">download</span>
        </button>

        <button type="button" class="settings-action-btn" id="importDataBtn">
          <span>📂 restore backup (.json)</span>
          <span style="font-size: 0.7rem; color: var(--sub);">upload</span>
        </button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" />

        <button type="button" class="settings-action-btn danger" id="resetDataBtn">
          <span>⚠️ reset all data</span>
          <span style="font-size: 0.7rem; color: inherit;">clear</span>
        </button>
      </div>

      <div class="modal-buttons" style="margin-top: 10px;">
        <button type="button" class="primary" id="closeSettingsBtn">close</button>
      </div>
    </div>
  </div>

  <!-- Input Progress Modal with Full Calendar -->
  <div class="modal-backdrop" id="inputModal">
    <form class="modal-box" id="inputForm">
      <h3 id="inputModalTitle">log progress</h3>
      <div class="modal-subtitle" id="inputModalGoalInfo"></div>

      <div class="calendar-box" id="calendarBox">
        <div class="calendar-header">
          <button type="button" class="cal-nav-btn" id="calPrevBtn">‹ prev</button>
          <span id="calMonthLabel">november 2026</span>
          <button type="button" class="cal-nav-btn" id="calNextBtn">next ›</button>
        </div>
        <div class="calendar-weekdays">
          <span>sun</span><span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="form-group">
        <label>selected date</label>
        <input type="date" id="inputDate" required />
      </div>
      <div class="form-group">
        <label id="inputAmountLabel">actual amount</label>

      <div id="inputSubmetricsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
      <div class="modal-buttons">
        <button type="button" id="cancelInput">cancel</button>
        <button type="submit" class="primary">save log</button>

  </div>

  <!-- Edit Habit Modal -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal-box">
      <h3>edit habit settings</h3>
      <div class="form-group">
        <label>habit name</label>
        <input type="text" id="editName" />
      </div>
      <div class="form-group">
        <label>color theme</label>
        <div class="color-picker-grid" id="colorPickerGrid">
          <div class="color-swatch" style="background: #e2b714;" data-color="#e2b714" title="Yellow"></div>
          <div class="color-swatch" style="background: #61afef;" data-color="#61afef" title="Cyan"></div>
          <div class="color-swatch" style="background: #c678dd;" data-color="#c678dd" title="Purple"></div>
          <div class="color-swatch" style="background: #98c379;" data-color="#98c379" title="Green"></div>
          <div class="color-swatch" style="background: #e06c75;" data-color="#e06c75" title="Red/Pink"></div>
          <div class="color-swatch" style="background: #d19a66;" data-color="#d19a66" title="Orange"></div>
          <div class="color-swatch" style="background: #56b6c2;" data-color="#56b6c2" title="Teal"></div>
          <div class="color-swatch" style="background: #abb2bf;" data-color="#abb2bf" title="Silver"></div>
        </div>
      </div>
      <div class="form-group">
        <label>category (free text)</label>
        <input type="text" id="editCategory" placeholder="e.g. health, work, study" />

      <div class="form-group">
        <label>main unit (e.g. km, pages, min)</label>
        <input type="text" id="editUnit" />
      </div>
      <div class="form-group">
        <label>daily main goal quantity</label>
        <input type="number" id="editGoal" min="1" />
      </div>
      <div class="form-group">
        <label>repeat</label>
        <div class="repeat-options-grid" id="repeatOptionsGrid">
          <button type="button" class="repeat-opt-btn" data-repeat="everyday">everyday</button>
          <button type="button" class="repeat-opt-btn" data-repeat="every_x_day">every x day</button>
          <button type="button" class="repeat-opt-btn" data-repeat="specific_days">specific days</button>
          <button type="button" class="repeat-opt-btn" data-repeat="times_a_week">times a week</button>
          <button type="button" class="repeat-opt-btn" data-repeat="times_a_month">times a month</button>
        </div>
        <div class="repeat-config-box" id="repeatConfigBox"></div>
      </div>
      <div class="form-group">
        <label>sub-metrics (shown in chart view)</label>
        <div class="submetric-list" id="editSubmetricsList"></div>
        <button type="button" class="add-sub-btn" id="addSubmetricBtn">+ add sub-metric</button>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelEdit">cancel</button>
        <button type="button" class="primary" id="saveEdit">save changes</button>
      </div>
    </div>
  </div>

  <script>
    const THEMES = ['serika', 'carbon', 'dracula', 'nord', 'matrix', 'yggdrasil'];
    const STORAGE_KEY = 'prokopton_habitkit_v12';
    const WEEKDAY_LABELS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const MONTH_NAMES = [
      'january', 'february', 'march', 'april', 'may', 'june',
      'july', 'august', 'september', 'october', 'november', 'december'
    ];

    const STOIC_QUOTES = [
      '"Waste no more time arguing what a good man should be. Be one." - Marcus Aurelius',
      '"First say to yourself what you would be; then do what you have to do." - Epictetus',
      '"We suffer more often in imagination than in reality." - Seneca',
      '"He who lives harmony with himself lives harmony with the universe." - Marcus Aurelius',
      '"Luck is what happens when preparation meets opportunity." - Seneca',
      '"No man is free who is not master of himself." - Epictetus',
      '"Control your passions lest they control you." - Epictetus',
      '"Begin at once to live, and count each separate day as a separate life." - Seneca',
      '"The obstacle is the way." - Marcus Aurelius',
      '"Dwell on the beauty of life. Watch the stars." - Marcus Aurelius'
    ];

    function initStoicQuote() {
      const randomQuote = STOIC_QUOTES[Math.floor(Math.random() * STOIC_QUOTES.length)];
      document.getElementById('stoicQuote').textContent = randomQuote;
    }

    function dateToKey(dateObj) {
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const offset = d.getTimezoneOffset();
      const local = new Date(d.getTime() - offset * 60 * 1000);
      return local.toISOString().split('T')[0];
    }

    function keyToDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function addDays(dateObj, delta) {
      return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate() + delta);
    }

    const todayKey = () => dateToKey(new Date());

    function formatDateDDMMYY(dateStr) {
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0].slice(-2)}`;
    }

    function getWeekStart(dateObj) {
      const day = dateObj.getDay();
      return addDays(dateObj, -day);
    }

    function getMonthStart(dateObj) {
      return new Date(dateObj.getFullYear(), dateObj.getMonth(), 1);
    }

    function normalizeRepeat(rep) {
      const validTypes = ['everyday', 'every_x_day', 'specific_days', 'times_a_week', 'times_a_month'];
      const type = validTypes.includes(rep?.type) ? rep.type : 'everyday';
      const days = Array.isArray(rep?.days)
        ? [...new Set(rep.days.map(Number).filter(n => n >= 0 && n <= 6))].sort()
        : [1, 3, 5];
      return {
        type,
        intervalDays: Math.max(1, parseInt(rep?.intervalDays, 10) || 2),
        days: days.length > 0 ? days : [1, 3, 5],
        timesPerWeek: Math.max(1, Math.min(7, parseInt(rep?.timesPerWeek, 10) || 3)),
        timesPerMonth: Math.max(1, Math.min(31, parseInt(rep?.timesPerMonth, 10) || 10))
      };
    }

    function normalizeHabit(habit) {
      return {
        ...habit,
        history: habit.history || {},
        repeat: normalizeRepeat(habit.repeat),
        subMetrics: Array.isArray(habit.subMetrics)
          ? habit.subMetrics.map((sm, idx) => ({
              id: sm.id || `sub_${idx}_${Date.now()}`,
              name: sm.name || '',
              unit: sm.unit || '',
              history: sm.history || {}
            }))
          : []
      };
    }

    let rawState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      theme: 'serika',
      habits: [
        { id: '1', name: 'read books', color: '#61afef', category: 'study', unit: 'pages', goal: 20, history: {}, repeat: normalizeRepeat({ type: 'everyday' }), subMetrics: [] },
        { id: '2', name: 'deep work', color: '#c678dd', category: 'work', unit: 'min', goal: 60, history: {}, repeat: normalizeRepeat({ type: 'everyday' }), subMetrics: [] }
      ]
    };

    let state = {
      theme: rawState.theme || 'serika',
      habits: (rawState.habits || []).map(normalizeHabit)
    };

    let currentFilter = 'all';
    let viewMode = 'cards';
    let chartRange = '14';
    let selectedChartMetricByHabit = {};
    let editingId = null;
    let draftRepeat = normalizeRepeat({ type: 'everyday' });
    let draftSubmetrics = [];
    let loggingHabitId = null;
    let calendarMonthDate = new Date();
    let selectedColor = '#e2b714';

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()
      );
      document.getElementById('themeName').textContent = theme;
      save();
    }

    function isDayGoalMet(habit, dateStr) {
      const val = habit.history[dateStr] || 0;
      return val >= (habit.goal || 1);
    }

    function countMetDaysInRange(habit, startDate, endDate) {
      let count = 0;
      let cursor = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
      const end = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
      while (cursor <= end) {
        if (isDayGoalMet(habit, dateToKey(cursor))) count++;
        cursor = addDays(cursor, 1);
      }
      return count;
    }

    function isWeekGoalMet(habit, weekStartDate) {
      const target = habit.repeat?.timesPerWeek || 3;
      return countMetDaysInRange(habit, weekStartDate, addDays(weekStartDate, 6)) >= target;
    }

    function isMonthGoalMet(habit, monthStartDate) {
      const target = habit.repeat?.timesPerMonth || 10;
      const monthEnd = new Date(monthStartDate.getFullYear(), monthStartDate.getMonth() + 1, 0);
      return countMetDaysInRange(habit, monthStartDate, monthEnd) >= target;
    }

    function isScheduledDay(habit, dateObj) {
      const rep = normalizeRepeat(habit.repeat);
      if (rep.type === 'specific_days') {
        return rep.days.includes(dateObj.getDay());
      }
      if (rep.type === 'every_x_day') {
        const dates = Object.keys(habit.history || {}).sort();
        if (dates.length === 0) return true;
        const anchor = keyToDate(dates[0]);
        const diffDays = Math.round((dateObj - anchor) / (1000 * 60 * 60 * 24));
        return ((diffDays % rep.intervalDays) + rep.intervalDays) % rep.intervalDays === 0;
      }
      return true;
    }

    function getRepeatSummary(habit) {
      const rep = normalizeRepeat(habit.repeat);
      if (rep.type === 'every_x_day') return `every ${rep.intervalDays}d`;
      if (rep.type === 'specific_days') {
        const labels = rep.days.map(d => WEEKDAY_LABELS[d]).join(',');
        return labels || 'specific days';
      }
      if (rep.type === 'times_a_week') return `${rep.timesPerWeek}x / week`;
      if (rep.type === 'times_a_month') return `${rep.timesPerMonth}x / month`;
      return 'everyday';
    }

    function getStreakDisplay(habit) {
      const rep = normalizeRepeat(habit.repeat);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      if (rep.type === 'times_a_week') {
        let streak = 0;
        let weekStart = getWeekStart(today);
        if (isWeekGoalMet(habit, weekStart)) {
          streak++;
        }
        weekStart = addDays(weekStart, -7);
        while (isWeekGoalMet(habit, weekStart)) {
          streak++;
          weekStart = addDays(weekStart, -7);
        }
        return `${streak}w 🔥`;
      }

      if (rep.type === 'times_a_month') {
        let streak = 0;
        let monthStart = getMonthStart(today);
        if (isMonthGoalMet(habit, monthStart)) {
          streak++;
        }
        monthStart = new Date(monthStart.getFullYear(), monthStart.getMonth() - 1, 1);
        while (isMonthGoalMet(habit, monthStart)) {
          streak++;
          monthStart = new Date(monthStart.getFullYear(), monthStart.getMonth() - 1, 1);
        }
        return `${streak}m 🔥`;
      }

      let streak = 0;
      let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      while (true) {
        const key = dateToKey(cursor);
        const met = isDayGoalMet(habit, key);
        if (met) {
          streak++;
          cursor = addDays(cursor, -1);
        } else if (key === dateToKey(today) || !isScheduledDay(habit, cursor)) {
          cursor = addDays(cursor, -1);
        } else {
          break;
        }
      }
      return `${streak}d 🔥`;
    }

    function getLongestStreakFromHistory(historyObj, threshold = null) {
      const dates = Object.keys(historyObj || {}).sort();
      if (dates.length === 0) return 0;

      let maxStreak = 0;
      let currentStreak = 0;
      let prevDate = null;

      dates.forEach(dateStr => {
        const val = historyObj[dateStr] || 0;
        const qualifies = threshold !== null ? val >= threshold : val > 0;
        if (qualifies) {
          if (!prevDate) {
            currentStreak = 1;
          } else {
            const d1 = new Date(prevDate);
            const d2 = new Date(dateStr);
            const diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) {
              currentStreak++;
            } else {
              currentStreak = 1;
            }
          }
          prevDate = dateStr;
          maxStreak = Math.max(maxStreak, currentStreak);
        } else {
          currentStreak = 0;
          prevDate = null;
        }
      });
      return maxStreak;
    }

    function getLongestHabitStreak(habit) {
      const rep = normalizeRepeat(habit.repeat);
      const dates = Object.keys(habit.history || {}).sort();
      if (dates.length === 0) return { value: 0, unit: 'days' };

      if (rep.type === 'times_a_week') {
        const earliestWeek = getWeekStart(keyToDate(dates[0]));
        const latestWeek = getWeekStart(new Date());
        let maxW = 0;
        let curW = 0;
        let prevW = null;
        let cursor = earliestWeek;
        while (cursor <= latestWeek) {
          if (isWeekGoalMet(habit, cursor)) {
            if (prevW && Math.round((cursor - prevW) / (1000 * 60 * 60 * 24)) === 7) {
              curW++;
            } else {
              curW = 1;
            }
            prevW = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
            maxW = Math.max(maxW, curW);
          } else {
            curW = 0;
            prevW = null;
          }
          cursor = addDays(cursor, 7);
        }
        return { value: maxW, unit: 'weeks' };
      }

      if (rep.type === 'times_a_month') {
        const earliestMonth = getMonthStart(keyToDate(dates[0]));
        const latestMonth = getMonthStart(new Date());
        let maxM = 0;
        let curM = 0;
        let prevM = null;
        let cursor = earliestMonth;
        while (cursor <= latestMonth) {
          if (isMonthGoalMet(habit, cursor)) {
            const monthDiff = prevM
              ? (cursor.getFullYear() - prevM.getFullYear()) * 12 + (cursor.getMonth() - prevM.getMonth())
              : 0;
            curM = prevM && monthDiff === 1 ? curM + 1 : 1;
            prevM = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
            maxM = Math.max(maxM, curM);
          } else {
            curM = 0;
            prevM = null;
          }
          cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
        }
        return { value: maxM, unit: 'months' };
      }

      return {
        value: getLongestStreakFromHistory(habit.history || {}, habit.goal || 1),
        unit: 'days'
      };
    }

    function getLevel(val, goal) {
      if (!val || val <= 0) return 0;
      const ratio = val / goal;
      if (ratio >= 1) return 3;
      if (ratio >= 0.5) return 2;
      return 1;
    }

    function shouldShowDotOnCell(habit, dateObj, level) {
      if (level > 0) return false;
      const rep = normalizeRepeat(habit.repeat);
      if (rep.type === 'times_a_week') {
        return isWeekGoalMet(habit, getWeekStart(dateObj));
      }
      if (rep.type === 'times_a_month') {
        return isMonthGoalMet(habit, getMonthStart(dateObj));
      }
      return false;
    }

    function setHabitEntries(habitId, dateStr, mainValue, subMetricValues = {}) {
      const habit = state.habits.find(h => h.id === habitId);
      if (!habit) return;

      if (mainValue <= 0) {
        delete habit.history[dateStr];
      } else {
        habit.history[dateStr] = mainValue;
      }

      habit.subMetrics = habit.subMetrics || [];
      habit.subMetrics.forEach(sm => {
        sm.history = sm.history || {};
        const subVal = subMetricValues[sm.id];
        if (subVal === undefined || subVal === null || isNaN(subVal) || subVal <= 0) {
          delete sm.history[dateStr];
        } else {
          sm.history[dateStr] = subVal;
        }
      });

      save();
    }

    function renderFilterBar() {
      const filterBar = document.getElementById('filterBar');
      filterBar.innerHTML = '';

      const categories = [...new Set(state.habits.map(h => h.category ? h.category.trim().toLowerCase() : '').filter(Boolean))];

      const allBtn = document.createElement('button');
      allBtn.className = `filter-btn ${currentFilter === 'all' ? 'active' : ''}`;
      allBtn.textContent = 'all';
      allBtn.onclick = () => {
        currentFilter = 'all';
        render();
      };
      filterBar.appendChild(allBtn);

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${currentFilter === cat ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          currentFilter = cat;
          render();
        };
        filterBar.appendChild(btn);
      });
    }

    function renderCards() {
      const today = todayKey();
      const now = new Date();
      const todayObj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const grid = document.getElementById('habitsGrid');
      grid.innerHTML = '';

      const filteredHabits = state.habits.filter(habit => {
        if (currentFilter === 'all') return true;
        const cat = habit.category ? habit.category.trim().toLowerCase() : '';
        return cat === currentFilter;
      });

      if (filteredHabits.length === 0) {
        grid.innerHTML = `<div style="text-align:center; color:var(--sub); padding: 30px;">no habits found.</div>`;
        return;
      }

      filteredHabits.forEach(habit => {
        const streakText = getStreakDisplay(habit);
        const todayVal = habit.history[today] || 0;
        const rep = normalizeRepeat(habit.repeat);
        const repSummary = getRepeatSummary(habit);
        const isDoneToday = rep.type === 'times_a_week'
          ? isWeekGoalMet(habit, getWeekStart(todayObj))
          : rep.type === 'times_a_month'
            ? isMonthGoalMet(habit, getMonthStart(todayObj))
            : todayVal >= habit.goal;
        const habitColor = habit.color || '#e2b714';
        const subCount = (habit.subMetrics || []).length;

        const card = document.createElement('div');
        card.className = 'habit-card';
        card.style.setProperty('--habit-accent', habitColor);

        let html = `
          <div class="habit-card-header">
            <div class="habit-info">
              <div class="habit-header-top">
                <h3>${habit.name}</h3>
                ${habit.category ? `<span class="category-tag">${habit.category}</span>` : ''}
              </div>
              <div class="habit-meta">
                <span>goal: ${habit.goal} ${habit.unit || ''}</span>
                <span>repeat: ${repSummary}</span>
                <span>streak: ${streakText}</span>
                ${subCount > 0 ? `<span>+${subCount} sub-metric${subCount > 1 ? 's' : ''}</span>` : ''}
              </div>
            </div>
            <div class="habit-actions">
              <button class="icon-btn edit-btn" title="Edit" aria-label="Edit">⚙</button>
              <button class="icon-btn delete-btn" title="Delete" aria-label="Delete">✕</button>
            </div>
          </div>
          <div class="habit-matrix-container">
            <div class="habit-matrix">
        `;

        for (let i = 90; i >= 0; i--) {
          const cellDate = addDays(todayObj, -i);
          const dateStr = dateToKey(cellDate);
          const val = habit.history[dateStr] || 0;
          const level = getLevel(val, habit.goal);
          const showDot = shouldShowDotOnCell(habit, cellDate, level);
          html += `<div class="matrix-cell" data-date="${dateStr}" data-level="${level}" data-dot="${showDot ? 'true' : 'false'}" role="button" tabindex="0" aria-label="Log progress for ${dateStr}" title="${dateStr}: ${val} / ${habit.goal} ${habit.unit || ''}"></div>`;
        }

        html += `
            </div>
          </div>
          <div class="habit-today-row">
            <div class="today-status-text">today: <span>${todayVal}</span> / ${habit.goal} ${habit.unit || ''}</div>
            <button type="button" class="open-input-btn ${isDoneToday ? 'done' : ''}">+ input</button>
          </div>
        `;

        card.innerHTML = html;

        card.querySelectorAll('.matrix-cell').forEach(cell => {
          cell.onclick = () => openInputModal(habit, cell.dataset.date);
          cell.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openInputModal(habit, cell.dataset.date);
            }
          };
        });

        card.querySelector('.edit-btn').onclick = () => openEditModal(habit);
        card.querySelector('.delete-btn').onclick = () => {
          state.habits = state.habits.filter(h => h.id !== habit.id);
          delete selectedChartMetricByHabit[habit.id];
          if (!state.habits.some(h => (h.category || '').toLowerCase() === currentFilter)) {
            currentFilter = 'all';
          }
          save();
        };
        card.querySelector('.open-input-btn').onclick = () => openInputModal(habit, todayKey());

        grid.appendChild(card);
      });
    }

    function getActiveMetricConfig(habit) {
      const chosenId = selectedChartMetricByHabit[habit.id] || 'main';
      if (chosenId !== 'main') {
        const found = (habit.subMetrics || []).find(sm => sm.id === chosenId);
        if (found) {
          return {
            id: found.id,
            label: found.name || 'sub-metric',
            unit: found.unit || '',
            history: found.history || {},
            goal: null,
            streakLabel: 'longest streak',
            longestStreak: {
              value: getLongestStreakFromHistory(found.history || {}, null),
              unit: 'days'
            }
          };
        }
      }
      return {
        id: 'main',
        label: habit.unit ? `main (${habit.unit})` : 'main',
        unit: habit.unit || '',
        history: habit.history || {},
        goal: habit.goal || 1,
        streakLabel: 'longest streak',
        longestStreak: getLongestHabitStreak(habit)
      };
    }

    function renderCharts() {
      const container = document.getElementById('chartContainer');
      container.innerHTML = '';

      if (state.habits.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--sub); padding: 30px;">no habits found.</div>`;
        return;
      }

      state.habits.forEach(habit => {
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.style.setProperty('--habit-accent', habit.color || '#e2b714');

        const activeMetric = getActiveMetricConfig(habit);
        const metricHistory = activeMetric.history;

        let daysCount = 14;
        if (chartRange === '30') daysCount = 30;
        if (chartRange === '60') daysCount = 60;
        if (chartRange === 'all') {
          const allHabitDates = [
            ...Object.keys(habit.history || {}),
            ...(habit.subMetrics || []).flatMap(sm => Object.keys(sm.history || {}))
          ].sort();
          if (allHabitDates.length > 0) {
            const earliest = keyToDate(allHabitDates[0]);
            const now = new Date();
            const diffTime = Math.abs(now - earliest);
            daysCount = Math.max(14, Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1);
          } else {
            daysCount = 14;
          }
        }

        const now = new Date();
        const todayObj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const dataPoints = [];
        for (let i = daysCount - 1; i >= 0; i--) {
          const dateStr = dateToKey(addDays(todayObj, -i));
          const val = metricHistory[dateStr] || 0;
          dataPoints.push({ date: dateStr, val });
        }

        const startDateFormatted = formatDateDDMMYY(dataPoints[0].date);
        const endDateFormatted = formatDateDDMMYY(dataPoints[dataPoints.length - 1].date);

        const allVals = Object.values(metricHistory).filter(v => typeof v === 'number');
        const highestRecord = allVals.length > 0 ? Math.max(...allVals) : 0;
        const sumVals = allVals.reduce((a, b) => a + b, 0);
        const avgVal = allVals.length > 0 ? (sumVals / allVals.length).toFixed(1) : '0';

        const width = 540;
        const height = 140;
        const padLeft = 65;
        const padRight = 25;
        const padTop = 30;
        const padBottom = 30;
        const chartWidth = width - padLeft - padRight;
        const chartHeight = height - padTop - padBottom;
        const maxVal = Math.max(
          activeMetric.goal || 0,
          ...dataPoints.map(p => p.val),
          1
        );

        const points = dataPoints.map((p, idx) => {
          const x = padLeft + (idx / (dataPoints.length - 1 || 1)) * chartWidth;
          const y = height - padBottom - (p.val / maxVal) * chartHeight;
          return { x, y, ...p };
        });

        const pathData = points.reduce((acc, p, idx) => `${acc} ${idx === 0 ? 'M' : 'L'} ${p.x} ${p.y}`, '');
        const goalY = activeMetric.goal !== null
          ? height - padBottom - (activeMetric.goal / maxVal) * chartHeight
          : null;
        const unitLabel = activeMetric.unit ? `(${activeMetric.unit})` : '(units)';

        const subMetrics = habit.subMetrics || [];
        const selectorButtonsHtml = [
          `<button type="button" class="metric-select-btn ${activeMetric.id === 'main' ? 'active' : ''}" data-metric-id="main">main${habit.unit ? ` · ${habit.unit}` : ''}</button>`,
          ...subMetrics
            .filter(sm => sm.name.trim())
            .map(sm => `<button type="button" class="metric-select-btn ${activeMetric.id === sm.id ? 'active' : ''}" data-metric-id="${sm.id}">${sm.name}${sm.unit ? ` · ${sm.unit}` : ''}</button>`)
        ].join('');

        let html = `
          <div class="habit-card-header">
            <div class="habit-info">
              <div class="habit-header-top">
                <h3>${habit.name}</h3>
                ${habit.category ? `<span class="category-tag">${habit.category}</span>` : ''}
              </div>
              <div class="habit-meta">
                <span>metric: ${activeMetric.label}</span>
                <span>repeat: ${getRepeatSummary(habit)}</span>
                <span>range: ${chartRange === 'all' ? 'all time' : chartRange + ' days'}</span>
              </div>
            </div>
          </div>
          <div class="metric-selector-bar">
            ${selectorButtonsHtml}
          </div>
          <div class="chart-wrapper">
            <svg viewBox="0 0 ${width} ${height}" class="time-chart">
              <text x="${padLeft}" y="${padTop - 12}" fill="var(--sub)" font-size="10" font-family="inherit" font-weight="700">${activeMetric.label} ${unitLabel}</text>
              <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${height - padBottom}" stroke="var(--sub)" stroke-width="1" opacity="0.4" />
              <line x1="${padLeft}" y1="${height - padBottom}" x2="${width - padRight}" y2="${height - padBottom}" stroke="var(--sub)" stroke-width="1" opacity="0.4" />
              <text x="${padLeft - 8}" y="${padTop + 4}" fill="var(--sub)" font-size="9" font-family="inherit" text-anchor="end">${maxVal}</text>
              <text x="${padLeft - 8}" y="${height - padBottom + 4}" fill="var(--sub)" font-size="9" font-family="inherit" text-anchor="end">0</text>
              ${goalY !== null ? `
                <line x1="${padLeft}" y1="${goalY}" x2="${width - padRight}" y2="${goalY}" stroke="var(--sub)" stroke-dasharray="4" stroke-width="1" opacity="0.6" />
                <text x="${width - padRight}" y="${goalY - 4}" fill="var(--sub)" font-size="9" text-anchor="end">goal: ${activeMetric.goal}</text>
              ` : ''}
              <path d="${pathData}" fill="none" stroke="var(--habit-accent, var(--main))" stroke-width="2" />
              ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--habit-accent, var(--main))"><title>${p.date}: ${p.val} ${activeMetric.unit || ''}</title></circle>`).join('')}
              <text x="${padLeft}" y="${height - 8}" fill="var(--sub)" font-size="9" font-family="inherit">${startDateFormatted}</text>
              <text x="${width - padRight}" y="${height - 8}" fill="var(--sub)" font-size="9" font-family="inherit" text-anchor="end">${endDateFormatted}</text>
            </svg>
          </div>
          <div class="metrics-grid">
            <div class="metric-card">
              <span class="metric-label">highest record</span>
              <span class="metric-value">${highestRecord} <small style="font-size:0.7rem; font-weight:400;">${activeMetric.unit || ''}</small></span>
            </div>
            <div class="metric-card">
              <span class="metric-label">average</span>
              <span class="metric-value">${avgVal} <small style="font-size:0.7rem; font-weight:400;">${activeMetric.unit || ''}</small></span>
            </div>
            <div class="metric-card">
              <span class="metric-label">${activeMetric.streakLabel}</span>
              <span class="metric-value">${activeMetric.longestStreak.value} <small style="font-size:0.7rem; font-weight:400;">${activeMetric.longestStreak.unit}</small></span>
            </div>
          </div>
        `;

        card.innerHTML = html;

        card.querySelectorAll('.metric-select-btn').forEach(btn => {
          btn.onclick = () => {
            selectedChartMetricByHabit[habit.id] = btn.dataset.metricId;
            renderCharts();
          };
        });

        container.appendChild(card);
      });
    }

    function render() {
      const filterBarEl = document.getElementById('filterBar');
      const chartRangeBarEl = document.getElementById('chartRangeBar');
      const addFormEl = document.getElementById('addForm');
      const cardsSection = document.getElementById('cardsSection');
      const chartSection = document.getElementById('chartSection');

      if (viewMode === 'cards') {
        filterBarEl.style.display = 'flex';
        chartRangeBarEl.style.display = 'none';
        addFormEl.style.display = 'flex';
        cardsSection.style.display = 'flex';
        chartSection.style.display = 'none';
        document.getElementById('currentViewBtn').classList.add('active');
        document.getElementById('chartViewBtn').classList.remove('active');
        renderFilterBar();
        renderCards();
      } else {
        filterBarEl.style.display = 'none';
        chartRangeBarEl.style.display = 'flex';
        addFormEl.style.display = 'none';
        cardsSection.style.display = 'none';
        chartSection.style.display = 'flex';
        document.getElementById('chartViewBtn').classList.add('active');
        document.getElementById('currentViewBtn').classList.remove('active');
        renderCharts();
      }
    }

    document.getElementById('currentViewBtn').onclick = () => {
      viewMode = 'cards';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };

    document.getElementById('chartViewBtn').onclick = () => {
      viewMode = 'chart';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };

    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        chartRange = btn.dataset.range;
        renderCharts();
      };
    });

    document.getElementById('addForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('habitInput');
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      state.habits.push({
        id: Date.now().toString(),
        name: val,
        color: '#e2b714',
        category: currentFilter !== 'all' ? currentFilter : '',
        unit: 'times',
        goal: 1,
        history: {},
        repeat: normalizeRepeat({ type: 'everyday' }),
        subMetrics: []
      });
      input.value = '';
      save();
    };

    const swatches = document.querySelectorAll('.color-swatch');
    swatches.forEach(swatch => {
      swatch.onclick = () => {
        swatches.forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        selectedColor = swatch.dataset.color;
      };
    });

    // Settings Modal Logic
    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('openSettingsBtn').onclick = () => settingsModal.classList.add('open');
    document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.remove('open');
    settingsModal.onclick = (e) => { if (e.target === settingsModal) settingsModal.classList.remove('open'); };

    // Export Backup JSON (PWA Compatible via Share Sheet / Blob)
    document.getElementById('exportDataBtn').onclick = async () => {
      const jsonString = JSON.stringify(state, null, 2);
      const fileName = `prokopton_backup_${todayKey()}.json`;
      
      const blob = new Blob([jsonString], { type: 'application/json' });
      
      if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'application/json' })] })) {
        try {
          const file = new File([blob], fileName, { type: 'application/json' });
          await navigator.share({
            files: [file],
            title: 'Prokopton Backup',
            text: 'Your local habit tracker backup JSON file.'
          });
          return;
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.log('Share failed, falling back...', err);
          } else {
            return;
          }
        }
      }

      try {
        const url = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = url;
        downloadAnchor.download = fileName;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonString);
        const win = window.open(dataStr, '_blank');
        if (!win) {
          alert('Popup blocked. Please check your browser settings or use Safari.');
        }
      }
    };

    // Import / Restore Backup JSON
    const importFileInput = document.getElementById('importFileInput');
    document.getElementById('importDataBtn').onclick = () => importFileInput.click();

    importFileInput.onchange = (e) => {
      const fileReader = new FileReader();
      if (e.target.files[0]) {
        fileReader.readAsText(e.target.files[0], "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed && parsed.habits) {
              state = {
                theme: parsed.theme || 'serika',
                habits: parsed.habits.map(normalizeHabit)
              };
              save();
              applyTheme(state.theme);
              alert('Backup restored successfully!');
              settingsModal.classList.remove('open');
            } else {
              alert('Invalid backup file format.');
            }
          } catch (err) {
            alert('Failed to parse JSON backup file.');
          }
        };
      }
    };

    // Reset Data
    document.getElementById('resetDataBtn').onclick = () => {
      if (confirm('Are you sure you want to reset all habits and history? This cannot be undone unless you have exported a backup.')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    };

    // Input Progress Modal & Full Calendar Logic
    const inputModal = document.getElementById('inputModal');
    const inputDateEl = document.getElementById('inputDate');
    const inputAmountEl = document.getElementById('inputAmount');
    const inputSubmetricsContainer = document.getElementById('inputSubmetricsContainer');
    const calendarGridEl = document.getElementById('calendarGrid');
    const calMonthLabelEl = document.getElementById('calMonthLabel');

    function getRecordedSummaryForDate(habit, dateStr) {
      const parts = [];
      const mainVal = habit.history?.[dateStr];
      if (mainVal !== undefined && mainVal !== null && mainVal > 0) {
        parts.push(`${mainVal}${habit.unit ? ' ' + habit.unit : ''}`);
      }
      (habit.subMetrics || []).forEach(sm => {
        const sv = sm.history?.[dateStr];
        if (sv !== undefined && sv !== null && sv > 0) {
          parts.push(`${sv}${sm.unit ? ' ' + sm.unit : ''}`);
        }
      });
      return parts;
    }

    function renderInputCalendar(habit) {
      if (!habit) return;
      const year = calendarMonthDate.getFullYear();
      const month = calendarMonthDate.getMonth();
      calMonthLabelEl.textContent = `${MONTH_NAMES[month]} ${year}`;

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const selectedDate = inputDateEl.value;

      let html = '';
      for (let i = 0; i < firstDayOfMonth; i++) {
        html += `<div class="cal-day-cell empty"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dObj = new Date(year, month, day);
        const dateStr = dateToKey(dObj);
        const recordedParts = getRecordedSummaryForDate(habit, dateStr);
        const hasData = recordedParts.length > 0;
        const isSelected = dateStr === selectedDate;
        const badgeText = hasData ? recordedParts.join(' · ') : '';

        html += `
          <button
            type="button"
            class="cal-day-cell ${hasData ? 'has-data' : ''} ${isSelected ? 'selected' : ''}"
            data-date="${dateStr}"
            title="${dateStr}${hasData ? ': ' + recordedParts.join(', ') : ''}"
          >
            <span class="cal-day-num">${day}</span>
            <span class="cal-day-val">${badgeText}</span>
          </button>
        `;
      }

      calendarGridEl.innerHTML = html;
      calendarGridEl.querySelectorAll('.cal-day-cell[data-date]').forEach(btn => {
        btn.onclick = () => {
          const clickedDate = btn.dataset.date;
          inputDateEl.value = clickedDate;
          populateInputValuesForDate(habit, clickedDate);
          renderInputCalendar(habit);
        };
      });
    }

    function populateInputValuesForDate(habit, targetDate) {
      inputAmountEl.value = habit.history[targetDate] !== undefined ? habit.history[targetDate] : '';
      inputSubmetricsContainer.innerHTML = '';

      const subs = (habit.subMetrics || []).filter(sm => sm.name.trim());
      if (subs.length > 0) {
        const header = document.createElement('div');
        header.className = 'submetric-divider';
        header.textContent = 'sub-metrics (optional)';
        inputSubmetricsContainer.appendChild(header);

        subs.forEach(sm => {
          const group = document.createElement('div');
          group.className = 'form-group';
          const existingVal = sm.history && sm.history[targetDate] !== undefined ? sm.history[targetDate] : '';
          group.innerHTML = `
            <label>${sm.name}${sm.unit ? ` (${sm.unit})` : ''}</label>
            <input type="number" step="any" min="0" placeholder="0" data-submetric-id="${sm.id}" value="${existingVal}" />
          `;
          inputSubmetricsContainer.appendChild(group);
        });
      }
    }

    function openInputModal(habit, targetDate = todayKey()) {
      loggingHabitId = habit.id;
      document.getElementById('inputModalTitle').textContent = `log: ${habit.name}`;
      document.getElementById('inputModalGoalInfo').textContent = `daily goal: ${habit.goal} ${habit.unit || ''}`;
      document.getElementById('inputAmountLabel').textContent = `main amount (${habit.unit || 'units'})`;
      
      inputDateEl.value = targetDate;
      const baseDate = keyToDate(targetDate);
      calendarMonthDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
      populateInputValuesForDate(habit, targetDate);
      renderInputCalendar(habit);
      
      inputModal.classList.add('open');
    }

    document.getElementById('calPrevBtn').onclick = () => {
      calendarMonthDate = new Date(calendarMonthDate.getFullYear(), calendarMonthDate.getMonth() - 1, 1);
      const habit = state.habits.find(h => h.id === loggingHabitId);
      renderInputCalendar(habit);
    };

    document.getElementById('calNextBtn').onclick = () => {
      calendarMonthDate = new Date(calendarMonthDate.getFullYear(), calendarMonthDate.getMonth() + 1, 1);
      const habit = state.habits.find(h => h.id === loggingHabitId);
      renderInputCalendar(habit);
    };

    inputDateEl.onchange = () => {
      const habit = state.habits.find(h => h.id === loggingHabitId);
      if (!habit || !inputDateEl.value) return;
      const picked = keyToDate(inputDateEl.value);
      calendarMonthDate = new Date(picked.getFullYear(), picked.getMonth(), 1);
      populateInputValuesForDate(habit, inputDateEl.value);
      renderInputCalendar(habit);
    };

    document.getElementById('cancelInput').onclick = () => {
      inputModal.classList.remove('open');
      loggingHabitId = null;
    };

    document.getElementById('inputForm').onsubmit = (e) => {
      e.preventDefault();
      const habit = state.habits.find(h => h.id === loggingHabitId);
      if (habit && inputDateEl.value) {
        const mainVal = parseFloat(inputAmountEl.value) || 0;
        const subVals = {};
        inputSubmetricsContainer.querySelectorAll('input[data-submetric-id]').forEach(inp => {
          const raw = inp.value.trim();
          subVals[inp.dataset.submetricId] = raw === '' ? 0 : parseFloat(raw);
        });
        setHabitEntries(habit.id, inputDateEl.value, mainVal, subVals);
      }
      inputModal.classList.remove('open');
      loggingHabitId = null;
    };

    // Edit Habit Modal, Repeat Config & Sub-Metrics Editor
    const editModal = document.getElementById('editModal');
    const editSubmetricsList = document.getElementById('editSubmetricsList');
    const repeatConfigBox = document.getElementById('repeatConfigBox');

    function renderRepeatUI() {
      document.querySelectorAll('.repeat-opt-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.repeat === draftRepeat.type);
      });

      if (draftRepeat.type === 'everyday') {
        repeatConfigBox.innerHTML = `<div style="font-size:0.75rem; color:var(--sub);">repeats every day.</div>`;
        return;
      }

      if (draftRepeat.type === 'every_x_day') {
        repeatConfigBox.innerHTML = `
          <div class="repeat-inline-row">
            <span>every</span>
            <input type="number" id="repeatIntervalInput" min="1" max="365" value="${draftRepeat.intervalDays}" />
            <span>days</span>
          </div>
        `;
        document.getElementById('repeatIntervalInput').oninput = (e) => {
          draftRepeat.intervalDays = Math.max(1, parseInt(e.target.value, 10) || 1);
        };
        return;
      }

      if (draftRepeat.type === 'specific_days') {
        repeatConfigBox.innerHTML = `
          <div class="days-picker-row">
            ${WEEKDAY_LABELS.map((label, idx) => `
              <button type="button" class="day-chip-btn ${draftRepeat.days.includes(idx) ? 'active' : ''}" data-day="${idx}">${label}</button>
            `).join('')}
          </div>
        `;
        repeatConfigBox.querySelectorAll('.day-chip-btn').forEach(btn => {
          btn.onclick = () => {
            const dIdx = Number(btn.dataset.day);
            if (draftRepeat.days.includes(dIdx)) {
              if (draftRepeat.days.length > 1) {
                draftRepeat.days = draftRepeat.days.filter(x => x !== dIdx);
              }
            } else {
              draftRepeat.days = [...draftRepeat.days, dIdx].sort();
            }
            renderRepeatUI();
          };
        });
        return;
      }

      if (draftRepeat.type === 'times_a_week') {
        repeatConfigBox.innerHTML = `
          <div class="repeat-inline-row">
            <input type="number" id="repeatWeeklyInput" min="1" max="7" value="${draftRepeat.timesPerWeek}" />
            <span>times per week (dots fill goal-met weeks)</span>
          </div>
        `;
        document.getElementById('repeatWeeklyInput').oninput = (e) => {
          draftRepeat.timesPerWeek = Math.max(1, Math.min(7, parseInt(e.target.value, 10) || 1));
        };
        return;
      }

      if (draftRepeat.type === 'times_a_month') {
        repeatConfigBox.innerHTML = `
          <div class="repeat-inline-row">
            <input type="number" id="repeatMonthlyInput" min="1" max="31" value="${draftRepeat.timesPerMonth}" />
            <span>times per month (dots fill goal-met months)</span>
          </div>
        `;
        document.getElementById('repeatMonthlyInput').oninput = (e) => {
          draftRepeat.timesPerMonth = Math.max(1, Math.min(31, parseInt(e.target.value, 10) || 1));
        };
      }
    }

    document.querySelectorAll('.repeat-opt-btn').forEach(btn => {
      btn.onclick = () => {
        draftRepeat.type = btn.dataset.repeat;
        renderRepeatUI();
      };
    });

    function syncDraftSubmetricsFromDOM() {
      const rows = editSubmetricsList.querySelectorAll('.submetric-row');
      draftSubmetrics = Array.from(rows).map(row => {
        const id = row.dataset.id;
        const existing = draftSubmetrics.find(d => d.id === id);
        return {
          id,
          name: row.querySelector('.sub-name-input').value.trim().toLowerCase(),
          unit: row.querySelector('.sub-unit-input').value.trim(),
          history: existing ? existing.history : {}
        };
      });
    }

    function renderSubmetricRows() {
      editSubmetricsList.innerHTML = '';
      draftSubmetrics.forEach(sm => {
        const row = document.createElement('div');
        row.className = 'submetric-row';
        row.dataset.id = sm.id;
        row.innerHTML = `
          <input type="text" class="sub-name-input" placeholder="name (e.g. speed)" value="${sm.name}" />
          <input type="text" class="sub-unit-input unit-input" placeholder="unit (km/h)" value="${sm.unit}" />
          <button type="button" class="remove-sub-btn" title="Remove">✕</button>
        `;
        row.querySelector('.remove-sub-btn').onclick = () => {
          syncDraftSubmetricsFromDOM();
          draftSubmetrics = draftSubmetrics.filter(item => item.id !== sm.id);
          renderSubmetricRows();
        };
        editSubmetricsList.appendChild(row);
      });
    }

    document.getElementById('addSubmetricBtn').onclick = () => {
      syncDraftSubmetricsFromDOM();
      draftSubmetrics.push({
        id: `sub_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        name: '',
        unit: '',
        history: {}
      });
      renderSubmetricRows();
    };

    function openEditModal(habit) {
      editingId = habit.id;
      document.getElementById('editName').value = habit.name;
      selectedColor = habit.color || '#e2b714';
      
      swatches.forEach(s => {
        if (s.dataset.color === selectedColor) {
          s.classList.add('selected');
        } else {
          s.classList.remove('selected');
        }
      });

      document.getElementById('editCategory').value = habit.category || '';
      document.getElementById('editUnit').value = habit.unit || '';
      document.getElementById('editGoal').value = habit.goal || 1;
      draftRepeat = normalizeRepeat(habit.repeat);
      renderRepeatUI();

      draftSubmetrics = (habit.subMetrics || []).map(sm => ({
        id: sm.id,
        name: sm.name,
        unit: sm.unit,
        history: { ...(sm.history || {}) }
      }));
      renderSubmetricRows();

      editModal.classList.add('open');
    }

    document.getElementById('cancelEdit').onclick = () => {
      editModal.classList.remove('open');
      editingId = null;
      draftSubmetrics = [];
    };

    document.getElementById('saveEdit').onclick = () => {
      const habit = state.habits.find(h => h.id === editingId);
      if (habit) {
        syncDraftSubmetricsFromDOM();
        habit.name = document.getElementById('editName').value.trim() || habit.name;
        habit.color = selectedColor;
        habit.category = document.getElementById('editCategory').value.trim().toLowerCase();
        habit.unit = document.getElementById('editUnit').value.trim();
        habit.goal = parseInt(document.getElementById('editGoal').value) || 1;
        habit.repeat = normalizeRepeat(draftRepeat);
        habit.subMetrics = draftSubmetrics.filter(sm => sm.name.length > 0);

        if (
          selectedChartMetricByHabit[habit.id] &&
          selectedChartMetricByHabit[habit.id] !== 'main' &&
          !habit.subMetrics.some(sm => sm.id === selectedChartMetricByHabit[habit.id])
        ) {
          selectedChartMetricByHabit[habit.id] = 'main';
        }

        save();
      }
      editModal.classList.remove('open');
      editingId = null;
      draftSubmetrics = [];
    };

    inputModal.onclick = (e) => { if (e.target === inputModal) inputModal.classList.remove('open'); };
    editModal.onclick = (e) => { if (e.target === editModal) editModal.classList.remove('open'); };

    function cycleTheme() {
      const next = THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length];
      applyTheme(next);
    }
    document.getElementById('themeBtn').onclick = cycleTheme;

    initStoicQuote();
    applyTheme(state.theme);
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
